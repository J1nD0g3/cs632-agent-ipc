exp: t06_pilot
datasets:
  hotpotqa: data/raw/hotpot_distractor_validation.parquet
  2wiki: data/raw/2wiki_dev.json
model: Qwen/Qwen3-8B
server:
  base_url: http://localhost:8100
  base_urls: [http://localhost:8100, http://localhost:8101, http://localhost:8102]
  served_name: qwen3-8b
  gpu: 5
  gpus: [5, 1, 2]
  flags: --max-model-len 32768 --gpu-memory-utilization 0.90 --enable-prefix-caching --enable-prompt-tokens-details --enable-auto-tool-choice --tool-call-parser hermes --seed 0
channels: [A1, A1zc, A2, B, C, D]
k: [1, 3, 5]
seeds: [1]
n_tasks: 10
max_tokens: 2048
max_turns: 12
concurrency: 6
