[project]
name = "agentipc"
version = "0.1.0"
description = "Shared files vs. message passing for LLM multi-agent communication"
requires-python = ">=3.10"
dependencies = ["httpx", "pyyaml", "numpy", "pandas", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]
data = ["pyarrow"]  # reads the HotpotQA parquet (agentipc.run, paper_numbers)

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
